---
- Système:
    - DSM:
        icon: synology.png
        href: https://maxsandman.synology.me:5001
        description: Interface d'administration Synology
        statusCheck: true
        statusCheckUrl: http://192.168.1.10:5000

    - Portainer:
        icon: portainer.png
        href: http://maxsandman.synology.me:9000
        description: Gestion des containers Docker
        server: my-docker
        container: portainer
        widget:
          type: portainer
          url: http://192.168.1.10:9000
          env: 3
          key: "{{HOMEPAGE_VAR_PORTAINER_KEY}}"

    - Nginx Proxy Manager:
        icon: nginx-proxy-manager.png
        href: http://maxsandman.synology.me:81
        description: Reverse proxy
        server: my-docker
        container: nginx-proxy-manager

    - Uptime Kuma:
        icon: uptime-kuma.png
        href: http://maxsandman.synology.me:3001
        description: Monitoring des services
        server: my-docker
        container: uptime-kuma
        widget:
          type: uptimekuma
          url: http://192.168.1.10:3001
          slug: "{{HOMEPAGE_VAR_UPTIMEKUMA_SLUG}}"

- Média:
    - Plex:
        icon: plex.png
        href: https://app.plex.tv/desktop/#!/
        description: Serveur multimédia
        statusCheck: true
        statusCheckUrl: http://192.168.1.10:32400
        widget:
          type: plex
          url: http://192.168.1.10:32400
          key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"

    - Overseerr:
        icon: overseerr.png
        href: http://maxsandman.synology.me:5055
        description: Demandes de films et séries
        server: my-docker
        container: Overseerr
        widget:
          type: overseerr
          url: http://192.168.1.10:5055
          key: "{{HOMEPAGE_VAR_OVERSEERR_KEY}}"

    - Sonarr:
        icon: sonarr.png
        href: http://maxsandman.synology.me:8989
        description: Gestion des séries TV
        server: my-docker
        container: Sonarr
        widget:
          type: sonarr
          url: http://192.168.1.10:8989
          key: "{{HOMEPAGE_VAR_SONARR_KEY}}"

    - Radarr:
        icon: radarr.png
        href: http://maxsandman.synology.me:7878
        description: Gestion des films
        server: my-docker
        container: Radarr
        widget:
          type: radarr
          url: http://192.168.1.10:7878
          key: "{{HOMEPAGE_VAR_RADARR_KEY}}"

    - Bazarr:
        icon: bazarr.png
        href: http://maxsandman.synology.me:6767
        description: Gestion des sous-titres
        server: my-docker
        container: Bazarr
        widget:
          type: bazarr
          url: http://192.168.1.10:6767
          key: "{{HOMEPAGE_VAR_BAZARR_KEY}}"

    - Prowlarr:
        icon: prowlarr.png
        href: http://maxsandman.synology.me:9696
        description: Gestion des indexeurs
        server: my-docker
        container: Prowlarr
        widget:
          type: prowlarr
          url: http://192.168.1.10:9696
          key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"

- Téléchargement:
    - qBittorrent:
        icon: qbittorrent.png
        href: http://maxsandman.synology.me:8080
        description: Client torrent
        server: my-docker
        container: Qbittorrent

    - NZBGet:
        icon: nzbget.png
        href: http://maxsandman.synology.me:6789

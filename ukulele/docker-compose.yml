# Ukulélé Facile : site statique servi par nginx (image multi-architecture, OK pour le DS218 en ARM64).
# Déploiement : voir README.md
services:
  ukulele:
    image: nginx:1.27-alpine
    container_name: ukulele
    restart: unless-stopped
    ports:
      - "8095:80"
    volumes:
      - ./app:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m
